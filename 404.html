<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emailto Redirecting...</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 500px;
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
    }

    a {
      color: #6ea8fe;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Opening email...</h1>
    <p id="message">Please wait.</p>
    <p id="fallback" style="display: none;">
      Your email app didn't open.
      <br>
      <a id="emailLink" href="#">Click here to open it.</a>
    </p>
  </div>

  <script>
    // Get everything after the first "/" in the URL
    const path = window.location.pathname.substring(8);

    // Decode things like %40 → @
    let email;

    try {
      email = decodeURIComponent(path);
    } catch (error) {
      email = "";
    }

    // Basic email validation
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    const message = document.getElementById("message");
    const fallback = document.getElementById("fallback");
    const emailLink = document.getElementById("emailLink");

    if (email && emailRegex.test(email)) {

      // Create the mailto URL
      const mailto = "mailto:" + email;

      // Set fallback link
      emailLink.href = mailto;

      // Try to open the user's email application
      window.location.href = mailto;

      // Show fallback after a short delay
      setTimeout(() => {
        fallback.style.display = "block";
        message.textContent = "If your email app didn't open, use the link below.";
      }, 1500);

    } else {

      message.innerHTML =
        "No valid email address was provided.<br><br>" +
        "Example:<br>" +
        "<code>example%40gmail.com</code>";
    }
  </script>
</body>
</html>
