<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emailto Redirecting...</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 500px;
      padding: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
    }

    a {
      color: #6ea8fe;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Opening email...</h1>
    <p id="message">Please wait.</p>
  </div>

  <script>
    // Get everything after /emailto/
    const path = window.location.pathname.substring(9);

    // Decode things like %40 → @
    let email;

    try {
      email = decodeURIComponent(path);
    } catch (error) {
      email = "";
    }

    // Basic email validation
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    const message = document.getElementById("message");

    if (email && emailRegex.test(email)) {

      // Try the normal email app first
      const mailto = "mailto:" + email;

      // Gmail fallback
      const gmail =
        "https://mail.google.com/mail/?view=cm&fs=1&to=" +
        encodeURIComponent(email);

      // Attempt to open the email app
      window.location.href = mailto;

      // If we're still on this page after 2 seconds,
      // attempt to open Gmail.
      setTimeout(() => {

        message.textContent = "Opening Gmail...";

        const gmailWindow = window.open(gmail, "_self");

        // If the browser refuses the Gmail navigation,
        // show an error after another 3 seconds.
        setTimeout(() => {
          if (!document.hidden) {
            document.getElementById("message").innerHTML =
              "Unable to open your email.<br><br>" +
              "Please open Gmail manually and email:<br>" +
              "<strong>" + email + "</strong>";
          }
        }, 3000);

      }, 2000);

    } else {

      message.innerHTML =
        "No valid email address was provided.<br><br>" +
        "Example:<br>" +
        "<code>example%40gmail.com</code>";
    }
  </script>
</body>
</html>
